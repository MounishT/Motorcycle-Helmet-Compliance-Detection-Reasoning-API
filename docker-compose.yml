# Docker Compose for Helmet Detection API
# For local development and testing

services:
  # Main API service
  helmet-detection-api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: helmet-detection-api
    ports:
      - "8000:8000"
    volumes:
      - ./weights:/app/weights
      - ./data:/app/data
      - ./logs:/app/logs
    environment:
      - WEIGHTS_PATH=/app/weights/best.pt
      - CONFIDENCE_THRESHOLD=0.25
      - REASONING_CONFIDENCE_THRESHOLD=0.5
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    networks:
      - helmet-network

  # Optional: Redis for rate limiting
  redis:
    image: redis:7-alpine
    container_name: helmet-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    networks:
      - helmet-network

  # Optional: Prometheus for metrics
  prometheus:
    image: prom/prometheus:latest
    container_name: helmet-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./configs/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus-data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--storage.tsdb.retention.time=200h'
      - '--web.enable-lifecycle'
    restart: unless-stopped
    networks:
      - helmet-network

volumes:
  redis-data:
  prometheus-data:

networks:
  helmet-network:
    driver: bridge
